<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="register-container">
        <h2>Create an Account</h2>
        <form action="#" method="POST">
            <div class="input-group password-wrapper">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
                <span class="password-toggle" onclick="togglePassword()">👁️</span>
                <div class="password-strength" id="password-strength">Strength: </div>
            </div>
            <button type="submit" class="register-button">Sign Up</button>
        </form>
    </div>

    <script>
        function togglePassword() {
            let passwordField = document.getElementById('password');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
            } else {
                passwordField.type = 'password';
            }
        }

        document.getElementById('password').addEventListener('input', function() {
            let strengthText = document.getElementById('password-strength');
            let password = this.value;
            if (password.length < 6) {
                strengthText.textContent = 'Strength: Weak';
                strengthText.className = 'password-strength weak';
            } else if (password.length < 10) {
                strengthText.textContent = 'Strength: Medium';
                strengthText.className = 'password-strength medium';
            } else {
                strengthText.textContent = 'Strength: Strong';
                strengthText.className = 'password-strength strong';
            }
        });
    </script>
</body>
</html>
